[project]
name = "opcode"
version = "0.1.0"
description = "A CLI AI coding agent with multi-provider LLM support"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.52.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "openai>=1.30.0",
]

[project.scripts]
opcode = "opcode_cli.main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
